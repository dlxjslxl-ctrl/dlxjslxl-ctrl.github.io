*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
line-height:1.7;color:#222;background:#fafafa;word-break:keep-all}
header,main,footer{max-width:780px;margin:0 auto;padding:16px}
header a{color:#222;text-decoration:none;font-weight:700;font-size:1.1em}
main{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
h1{font-size:1.5em;line-height:1.4;margin:.3em 0}h2{font-size:1.2em;margin-top:1.6em}
a{color:#0b63c5}img{max-width:100%;height:auto;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:.95em;display:block;overflow-x:auto}
th,td{border:1px solid #e3e3e3;padding:6px 8px;text-align:left;vertical-align:top}th{background:#f3f5f8}
.disclosure{background:#fff4d6;border:2px solid #f0b400;color:#5a4000;font-size:1.05em;font-weight:600;
padding:12px 14px;border-radius:10px;margin:0 0 16px}
.meta{color:#777;font-size:.9em}.btn{display:inline-block;background:#0b63c5;color:#fff;padding:10px 18px;
border-radius:8px;text-decoration:none;font-weight:600;margin:6px 0}
.card{border:1px solid #eee;border-radius:10px;padding:12px;margin:12px 0}
.calc label{display:block;margin:10px 0 4px;font-weight:600}
.calc input,.calc select{width:100%;max-width:320px;padding:9px;font-size:1em;border:1px solid #ccc;border-radius:8px}
.calc button{margin-top:12px;padding:10px 20px;font-size:1em;border:0;border-radius:8px;background:#0b63c5;color:#fff}
.result{margin-top:14px;padding:12px;background:#eef6ff;border-radius:8px;font-size:1.1em;font-weight:600;min-height:1em}
ul.pages{padding-left:1.1em}ul.pages li{margin:6px 0}
footer{color:#888;font-size:.85em;text-align:center}
